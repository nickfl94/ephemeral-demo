name: AWS Infrastructure Setup

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to setup (dev/staging/prod)'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod

env:
  AWS_REGION: us-east-1

jobs:
  setup-aws-infrastructure:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Create S3 bucket for Terraform state
        run: |
          BUCKET_NAME="ephemeral-demo-${{ inputs.environment }}-terraform-state-$(date +%s)"
          
          # Create S3 bucket
          aws s3 mb s3://$BUCKET_NAME --region ${{ env.AWS_REGION }}
          
          # Enable versioning
          aws s3api put-bucket-versioning \
            --bucket $BUCKET_NAME \
            --versioning-configuration Status=Enabled
          
          # Enable server-side encryption
          aws s3api put-bucket-encryption \
            --bucket $BUCKET_NAME \
            --server-side-encryption-configuration '{
              "Rules": [{
                "ApplyServerSideEncryptionByDefault": {
                  "SSEAlgorithm": "AES256"
                }
              }]
            }'
          
          echo "Created S3 bucket: $BUCKET_NAME"
          echo "TERRAFORM_STATE_BUCKET=$BUCKET_NAME" >> $GITHUB_ENV

      - name: Create DynamoDB table for Terraform locks
        run: |
          TABLE_NAME="ephemeral-demo-${{ inputs.environment }}-terraform-locks"
          
          aws dynamodb create-table \
            --table-name $TABLE_NAME \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 \
            --region ${{ env.AWS_REGION }}
          
          echo "Created DynamoDB table: $TABLE_NAME"
          echo "TERRAFORM_STATE_TABLE=$TABLE_NAME" >> $GITHUB_ENV

      - name: Create ECR repository
        run: |
          REPO_NAME="ephemeral-demo-${{ inputs.environment }}"
          
          aws ecr create-repository \
            --repository-name $REPO_NAME \
            --region ${{ env.AWS_REGION }} || true
          
          # Set lifecycle policy to clean up old images
          aws ecr put-lifecycle-policy \
            --repository-name $REPO_NAME \
            --lifecycle-policy-text '{
              "rules": [{
                "rulePriority": 1,
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": {
                  "type": "expire"
                }
              }]
            }' \
            --region ${{ env.AWS_REGION }}
          
          ECR_URI=$(aws ecr describe-repositories --repository-names $REPO_NAME --query 'repositories[0].repositoryUri' --output text --region ${{ env.AWS_REGION }})
          echo "Created ECR repository: $ECR_URI"
          echo "ECR_REPOSITORY_URI=$ECR_URI" >> $GITHUB_ENV

      - name: Create IAM role for ephemeral environments
        run: |
          ROLE_NAME="EphemeralDemoRole-${{ inputs.environment }}"
          
          # Create trust policy
          cat > trust-policy.json << EOF
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Service": ["ec2.amazonaws.com", "ecs-tasks.amazonaws.com"]
                },
                "Action": "sts:AssumeRole"
              }
            ]
          }
          EOF
          
          # Create IAM role
          aws iam create-role \
            --role-name $ROLE_NAME \
            --assume-role-policy-document file://trust-policy.json || true
          
          # Attach necessary policies
          aws iam attach-role-policy \
            --role-name $ROLE_NAME \
            --policy-arn arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
          
          aws iam attach-role-policy \
            --role-name $ROLE_NAME \
            --policy-arn arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
          
          echo "Created IAM role: $ROLE_NAME"

      - name: Output setup information
        run: |
          echo "## AWS Infrastructure Setup Complete"
          echo ""
          echo "**Environment:** ${{ inputs.environment }}"
          echo "**Region:** ${{ env.AWS_REGION }}"
          echo "**S3 Bucket:** ${{ env.TERRAFORM_STATE_BUCKET }}"
          echo "**DynamoDB Table:** ${{ env.TERRAFORM_STATE_TABLE }}"
          echo "**ECR Repository:** ${{ env.ECR_REPOSITORY_URI }}"
          echo ""
          echo "### Required GitHub Secrets:"
          echo "- AWS_ACCESS_KEY_ID"
          echo "- AWS_SECRET_ACCESS_KEY"
          echo "- TERRAFORM_STATE_BUCKET: ${{ env.TERRAFORM_STATE_BUCKET }}"
          echo "- TERRAFORM_STATE_TABLE: ${{ env.TERRAFORM_STATE_TABLE }}"
          echo "- ECR_REPOSITORY_URI: ${{ env.ECR_REPOSITORY_URI }}"