name: Debug Workflow Triggers

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, develop, dev]
  push:
    branches: [feature/*, dev, develop, main]
  workflow_dispatch:

jobs:
  debug-info:
    runs-on: ubuntu-latest
    steps:
      - name: Debug workflow information
        run: |
          echo "=== Workflow Debug Information ==="
          echo "Event name: ${{ github.event_name }}"
          echo "Event action: ${{ github.event.action }}"
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"
          echo "Base ref: ${{ github.base_ref }}"
          echo "Head ref: ${{ github.head_ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Job: ${{ github.job }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run number: ${{ github.run_number }}"
          echo "=================================="
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "=== Pull Request Information ==="
            echo "PR number: ${{ github.event.number }}"
            echo "PR title: ${{ github.event.pull_request.title }}"
            echo "PR state: ${{ github.event.pull_request.state }}"
            echo "PR base branch: ${{ github.event.pull_request.base.ref }}"
            echo "PR head branch: ${{ github.event.pull_request.head.ref }}"
            echo "PR merged: ${{ github.event.pull_request.merged }}"
            echo "=================================="
          fi

      - name: List workflow files
        run: |
          echo "=== Available Workflow Files ==="
          find .github/workflows -name "*.yml" -o -name "*.yaml" 2>/dev/null || echo "No workflow files found"
          echo "=================================="

      - name: Check repository settings
        run: |
          echo "=== Repository Information ==="
          echo "Default branch should be accessible via API"
          echo "Current working directory: $(pwd)"
          echo "Git status:"
          git status || echo "Not a git repository or git not available"
          echo "=================================="